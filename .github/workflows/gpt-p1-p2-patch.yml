name: GPT P1 P2 final validation

on:
  push:
    branches:
      - gpt/report-p1-p2-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-fix-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/report-p1-p2-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Align stale paid-report prompt contract
        run: sed -i 's/paid-report-v7-editorial-v9-reduced-ai-facts/paid-report-v7-editorial-v10-latency-balanced/' scripts/day9-narrative-boundary-test.ts
      - name: Validate final P1/P2 contracts
        run: |
          npm run test:day9:narrative-boundary
          npm run test:intro:day-pillar
          npm run test:report:dedup
          npm run test:one-to-one:quality-gate
          npm run lint
          npm run build
      - name: Commit stale contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/day9-narrative-boundary-test.ts
          git commit -m "test: align paid report v10 narrative contract"
          git push origin HEAD:gpt/report-p1-p2-20260821
