name: Temporary score and library delete patch

on:
  push:
    branches:
      - gpt/score-library-delete-20260822

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/score-library-delete-20260822
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        run: python .github/scripts/gpt-score-library-delete.py
      - name: Stop when already patched
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: npm ci
      - name: Validate focused contracts
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run test:compatibility:engine
          npm run test:day18:account-report-library
          npm run test:day15:one-to-many-result-ui
          npm run lint
          npm run build
      - name: Commit patch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "feat: add report deletion and recalibrate compatibility scores"
          git push origin HEAD:gpt/score-library-delete-20260822
