name: Temporary hotfix lint fix

on:
  push:
    branches:
      - gpt/hotfix-report-ui-daypillar-20260822

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/hotfix-report-ui-daypillar-20260822
      - name: Remove template-literal backticks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/narrative/report-engine-v7.ts')
          text = path.read_text(encoding='utf-8')
          old = 'facts.A/B.dayPillar에는 계산된 일주 객체가 항상 있으므로 `일주 미확인`이라고 쓰지 말고 korean/hanja 값을 그대로 확인해 설명하세요.'
          new = 'facts.A/B.dayPillar에는 계산된 일주 객체가 항상 있으므로 일주 미확인이라고 쓰지 말고 korean/hanja 값을 그대로 확인해 설명하세요.'
          if old not in text:
              print('already fixed')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/narrative/report-engine-v7.ts
          git commit -m "fix: repair intro prompt template syntax"
          git push origin HEAD:gpt/hotfix-report-ui-daypillar-20260822
