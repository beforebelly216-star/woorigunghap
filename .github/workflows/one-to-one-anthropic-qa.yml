name: 1:1 Anthropic sample QA

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Sample relationship to generate
        required: true
        default: lover
        type: choice
        options:
          - lover
          - coworker-boss

permissions:
  contents: read

jobs:
  sample-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Anthropic secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY repository secret is required."
            exit 1
          fi
      - name: Generate and validate real Claude sample
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_SAMPLE: ${{ inputs.sample }}
          QA_OUTPUT_PATH: artifacts/one-to-one-${{ inputs.sample }}.json
        run: npm run qa:one-to-one:anthropic
      - name: Upload sample report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-to-one-${{ inputs.sample }}-sample
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7
