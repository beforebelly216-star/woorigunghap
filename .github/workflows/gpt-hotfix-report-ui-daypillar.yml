name: Temporary report UI and day-pillar hotfix

on:
  push:
    branches:
      - gpt/hotfix-report-ui-daypillar-20260822

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/hotfix-report-ui-daypillar-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 .github/scripts/gpt-hotfix-report-ui-daypillar.py
          git add src scripts docs
          git commit -m "fix: repair stored day-pillar display and finish P5 UI coverage"
          git push origin HEAD:gpt/hotfix-report-ui-daypillar-20260822
      - name: Validate focused contracts
        run: |
          npm run test:intro:day-pillar
          npm run test:report:p5-ui
          npm run test:report:dedup
          npm run test:report:tone
          npm run test:report:persona
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
