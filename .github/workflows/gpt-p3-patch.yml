name: Temporary P3 report patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'gpt/report-p3-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/report-p3-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply P3 patch once
        run: |
          if [ -f scripts/report-tone-contract-test.ts ]; then
            echo "P3 patch already applied; skipping patch step."
            exit 0
          fi
          node .github/scripts/gpt-p3-patch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/lib/narrative/report-engine-v7.ts \
            src/lib/narrative/report-engine-v6-request.ts \
            src/app/one-to-one/result/report-v2-chapters-a.tsx \
            src/app/report-extra.css \
            scripts/day9-narrative-boundary-test.ts \
            scripts/day10-editorial-policy-test.ts \
            scripts/day21-relationship-editorial-test.ts \
            scripts/day23-system-qa-test.ts \
            scripts/one-to-one-anthropic-sample-qa.ts \
            scripts/one-to-one-quality-gate-test.ts \
            scripts/report-tone-contract-test.ts \
            package.json \
            .github/workflows/manse-validation.yml \
            docs/DECISIONS.md \
            docs/PROJECT_STATE.md \
            docs/NEXT_TASK.md
          git commit -m "fix: strengthen paid report P3 narrative contract"
          git push origin HEAD:gpt/report-p3-20260822
      - name: Run P3 narrative contracts
        run: |
          npm run test:report:tone
          npm run test:intro:day-pillar
          npm run test:report:dedup
          npm run test:one-to-one:quality-gate
          npm run test:day9:narrative-boundary
          npm run test:day10:editorial
          npm run test:day21:relationship-editorial
          npm run test:day23:system-qa
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
