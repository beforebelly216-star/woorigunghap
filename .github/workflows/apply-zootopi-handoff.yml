name: Apply Zootopi handoff

on:
  push:
    branches:
      - zootopi-transfer-gpt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch handoff branch
        run: git fetch origin zootopi-transfer-gpt

      - name: Apply Claude runtime payload
        run: |
          git show origin/zootopi-transfer-gpt:.handoff/zootopi-runtime-final.tar.gz.b64 | base64 -d > /tmp/zootopi-runtime-final.tar.gz
          tar -xzf /tmp/zootopi-runtime-final.tar.gz -C .
          test -f src/components/zootopi-mark.tsx
          test -f src/components/candlestick-score.tsx
          test -f src/lib/compatibility/stock-theme.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit and push main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No runtime changes to commit."
            exit 0
          fi
          git commit -m "feat: apply zootopi stock-theme skin"
          git push origin HEAD:main
