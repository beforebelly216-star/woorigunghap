name: Temporary P5 pastel report UI

on:
  push:
    branches:
      - gpt/p5-pastel-ui-20260822
  pull_request:
    paths:
      - "src/**"
      - "scripts/report-p5-ui-contract-test.ts"
      - "package.json"
      - ".github/workflows/gpt-p5-pastel-ui.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate P5 UI contracts
        run: |
          npm run test:report:p5-ui
          npm run test:report:persona
          npm run test:report:share-card
          npm run test:report:day-pillar-characters
          npm run test:report:dedup
          npm run test:report:tone
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
