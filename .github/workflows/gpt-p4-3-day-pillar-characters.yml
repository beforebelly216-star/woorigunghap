name: Temporary P4-3 day pillar characters

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'gpt/p4-3-day-pillar-characters-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/p4-3-day-pillar-characters-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply P4-3 integration once
        run: |
          node .github/scripts/gpt-p4-3-day-pillar-characters.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts package.json .github/workflows/manse-validation.yml docs
          if ! git diff --cached --quiet; then
            git commit -m "feat: connect 60 day-pillar characters to paid report"
            git push origin HEAD:gpt/p4-3-day-pillar-characters-20260822
          fi
      - name: Validate P4-3
        run: |
          npm run test:report:day-pillar-characters
          npm run test:report:persona
          npm run test:report:share-card
          npm run test:intro:day-pillar
          npm run test:one-to-one:quality-gate
      - run: npm run lint
      - run: npm run build
