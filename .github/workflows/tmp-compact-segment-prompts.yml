name: Temporary compact segment prompts

on:
  push:
    branches:
      - agent/predeploy-generation-kakao-hotfix
    paths:
      - .github/workflows/tmp-compact-segment-prompts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/predeploy-generation-kakao-hotfix
          fetch-depth: 0
      - name: Compact DYNAMICS and ACTION output instructions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/narrative/report-engine-v7.ts')
          text = path.read_text()
          replacements = [
            (
              '[담당 범위: CH2 상대 해부 + CH3 나의 강점 + 기본 케미]\\n-',
              '[담당 범위: CH2 상대 해부 + CH3 나의 강점 + 기본 케미]\\n- 이 세그먼트 전체는 공백 제외 약 1,800~2,600자로 간결하게 작성하고 같은 뜻을 반복하지 마세요.\\n-'
            ),
            ('chemistry.overview는 4~5문장, dayMaster/dayBranch/yinYang/elements는 각각 3~4문장', 'chemistry.overview는 2문장, dayMaster/dayBranch/yinYang/elements는 각각 1문장'),
            ('bondAndFriction.overview는 4~5문장.', 'bondAndFriction.overview는 2문장.'),
            ('realLifeManifestations는 최소 3개이며', 'realLifeManifestations는 2개이며'),
            ('directionalImpact의 overview/aToB/bToA/beneficialSupply/burdenSupply/asymmetry는 각각 3~5문장.', 'directionalImpact의 overview/aToB/bToA/beneficialSupply/burdenSupply/asymmetry는 각각 1~2문장.'),
            ('partnerDeepDive.outerInnerContrast는 최소 5문장.', 'partnerDeepDive.outerInnerContrast는 2~3문장.'),
            ('partnerDeepDive.comfortTriggers / sensitiveTriggers / preferredInteraction은 각각 최소 3개.', 'partnerDeepDive.comfortTriggers / sensitiveTriggers / preferredInteraction은 각각 2개.'),
            ('partnerDeepDive.observableScenes는 최소 3개.', 'partnerDeepDive.observableScenes는 2개.'),
            ('whyItWorks와 howToUse를 각각 2~4문장으로', 'whyItWorks와 howToUse를 각각 1~2문장으로'),
            ('conversationScripts는 최소 2개, 가능하면 3개.', 'conversationScripts는 2개.'),
            ('backfireHabits는 최소 3개.', 'backfireHabits는 2개.'),
            (
              '[담당 범위: CH4 관계별 전략 + 갈등/미래 조건 + CH8 실행 계획]\\n-',
              '[담당 범위: CH4 관계별 전략 + 갈등/미래 조건 + CH8 실행 계획]\\n- 이 세그먼트 전체는 공백 제외 약 1,800~2,600자로 간결하게 작성하고 반복 설명을 빼세요.\\n-'
            ),
            ('relationshipFlow.overview/roles/initiative/intimacy는 각각 3~5문장.', 'relationshipFlow.overview/roles/initiative/intimacy는 각각 1~2문장.'),
            ('conflictScenarios는 최소 2개, 가능하면 3개.', 'conflictScenarios는 2개.'),
            ('relationshipSpecific.overview는 4~6문장, points는 최소 4개이며 각 detail은 3~5문장', 'relationshipSpecific.overview는 2문장, points는 3개 이상이며 각 detail은 1~2문장'),
            ('situationStrategy.priority는 지금 이 관계에서 가장 먼저 볼 한 가지를 3~4문장으로', 'situationStrategy.priority는 지금 이 관계에서 가장 먼저 볼 한 가지를 2문장으로'),
            ('situationStrategy.stepByStep은 최소 4단계, 짝사랑/썸은 최대 5단계 권장.', 'situationStrategy.stepByStep은 정확히 4단계.'),
            ('progressSignals와 stopSignals는 각각 최소 2개, 가능하면 3개.', 'progressSignals와 stopSignals는 각각 2개.'),
            ('redFlag와 warning은 과장 없이 3~4문장으로', 'redFlag와 warning은 과장 없이 1~2문장으로'),
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one match, found {count}: {old}')
            text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/lib/narrative/report-engine-v7.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/narrative/report-engine-v7.ts
          git commit -m "fix: bound paid report segment length"
          git push origin HEAD:agent/predeploy-generation-kakao-hotfix
