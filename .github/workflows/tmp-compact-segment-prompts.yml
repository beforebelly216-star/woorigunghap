name: Temporary compact segment prompts

on:
  push:
    branches:
      - agent/predeploy-generation-kakao-hotfix
    paths:
      - .github/workflows/tmp-compact-segment-prompts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/predeploy-generation-kakao-hotfix
          fetch-depth: 0
      - name: Compact DYNAMICS and ACTION output instructions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/narrative/report-engine-v7.ts')
          text = path.read_text()

          def replace_system_block(text: str, marker: str, replacement: str) -> str:
              marker_index = text.index(marker)
              start = text.rfind('    system:', 0, marker_index)
              end = text.index('    user:', marker_index)
              if start < 0 or end < 0:
                  raise SystemExit(f'failed to resolve system block for {marker}')
              return text[:start] + replacement + text[end:]

          dynamics_marker = '[담당 범위: CH2 상대 해부 + CH3 나의 강점 + 기본 케미]'
          dynamics = '''    system: `${BASE_RULES}\\n\\n${relationshipRules}\\n\\n[담당 범위: CH2 상대 해부 + CH3 나의 강점 + 기본 케미]\\n- 이 세그먼트 전체를 공백 제외 약 1,800~2,600자로 간결하게 작성하세요. 같은 뜻을 반복하지 마세요.\\n- chemistry의 overview와 dayMaster/dayBranch/yinYang/elements는 각 1~2문장으로 핵심 계산 의미와 현실 장면만 연결하세요.\\n- bondAndFriction은 실제 evidence가 있는 positive/friction 항목을 각각 2개 중심으로 쓰고, realLifeManifestations는 2~3개만 구체적으로 작성하세요.\\n- directionalImpact 각 필드는 1~2문장으로 {{SELF}}→{{PARTNER}}와 {{PARTNER}}→{{SELF}} 차이만 선명하게 설명하세요. 내부 지표명은 출력하지 마세요.\\n- partnerDeepDive는 outerInnerContrast 2~3문장, triggers/interaction/observableScenes는 각 2개 중심으로 작성하세요. 상대의 속마음을 사실처럼 확정하지 마세요.\\n- personalLeverage.topStrengths는 3개, conversationScripts는 2개, backfireHabits는 2개로 제한하고 각 설명은 1~2문장으로 끝내세요.\\n- 오행을 심리 능력의 원인으로 쓰지 말고 친구·직장동료에는 연애·성적 프레임을 섞지 마세요.`,
'''
          text = replace_system_block(text, dynamics_marker, dynamics)

          action_marker = '[담당 범위: CH4 관계별 전략 + 갈등/미래 조건 + CH8 실행 계획]'
          action = '''    system: `${BASE_RULES}\\n\\n${relationshipRules}\\n\\n[담당 범위: CH4 관계별 전략 + 갈등/미래 조건 + CH8 실행 계획]\\n- 이 세그먼트 전체를 공백 제외 약 1,800~2,600자로 간결하게 작성하세요. 반복 설명과 장황한 서론은 빼세요.\\n- relationshipFlow 각 필드는 1~2문장, conflictScenarios는 2개, relationshipSpecific.points는 3~4개로 제한하세요.\\n- editorialContext.userQuestion이 있으면 마지막 relationshipSpecific 항목에서 서버 evidence로 답할 수 있는 범위만 직접 답하세요. 속마음·사건·예언은 확정하지 마세요.\\n- situationStrategy는 priority 2문장, stepByStep 4단계, progressSignals/stopSignals 각 2개로 작성하고 모두 관찰 가능한 행동 기준으로 쓰세요.\\n- strengthsAndRisks는 strengths/repeatedFrictions 각 3개, redFlag/warning 각 1~2문장으로 작성하세요.\\n- practicalManual은 do 4개, dont 3개, conflictProtocol 4단계, recommendedActivities 3개로 짧게 작성하세요.\\n- actionPlan30.weeks는 1~4주차 정확히 4개로 유지하되 각 주차 goal/action/check를 각각 한 문장으로 끝내세요. 서버가 주지 않은 연락 횟수·시간 간격은 만들지 마세요.\\n- 짝사랑·썸은 교제를 확정하지 말고 친구·직장동료에는 연애·성적 문구를 넣지 마세요. 직장동료는 협업·보고·업무 루틴 중심으로 작성하세요.`,
'''
          text = replace_system_block(text, action_marker, action)

          if text.count('공백 제외 약 1,800~2,600자') != 2:
              raise SystemExit('expected two compact output targets')
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/lib/narrative/report-engine-v7.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/narrative/report-engine-v7.ts
          git commit -m "fix: bound paid report segment length"
          git push origin HEAD:agent/predeploy-generation-kakao-hotfix
