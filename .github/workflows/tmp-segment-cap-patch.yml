name: Temporary bounded segment cap patch

on:
  push:
    branches:
      - agent/predeploy-generation-kakao-hotfix
    paths:
      - .github/workflows/tmp-segment-cap-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/predeploy-generation-kakao-hotfix
          fetch-depth: 0
      - name: Raise only long-segment token cap
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/lib/narrative/report-engine-v6-request.ts')
          text = source.read_text()
          old = 'Math.min(args.maxTokens, 5_000)'
          new = 'Math.min(args.maxTokens, 6_500)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one source cap match, found {text.count(old)}')
          source.write_text(text.replace(old, new))

          escaped_old = r'Math\.min\(args\.maxTokens, 5_000\)'
          escaped_new = r'Math\.min\(args\.maxTokens, 6_500\)'
          updated_tests = 0
          for path in Path('scripts').glob('*.ts'):
              current = path.read_text()
              if escaped_old in current:
                  path.write_text(current.replace(escaped_old, escaped_new))
                  updated_tests += 1
          if updated_tests < 2:
              raise SystemExit(f'expected at least two contract-test cap assertions, found {updated_tests}')
          PY
          git diff --check
          git diff -- src/lib/narrative/report-engine-v6-request.ts scripts/
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/narrative/report-engine-v6-request.ts scripts
          git commit -m "fix: give bounded long segments enough output budget"
          git push origin HEAD:agent/predeploy-generation-kakao-hotfix
