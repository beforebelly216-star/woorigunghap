name: Temporary P4-2 duplicate fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'gpt/p4-2-compatibility-share-card-20260822'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/p4-2-compatibility-share-card-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remove duplicate integration
        run: |
          node .github/scripts/fix-p4-2-duplicates.mjs
          git add -- src/app/one-to-one/result/result-v2.tsx
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: remove duplicate P4-2 share integration"
            git push origin HEAD:gpt/p4-2-compatibility-share-card-20260822
          fi
      - run: npm run test:report:share-card
      - run: npm run lint
      - run: npm run build
