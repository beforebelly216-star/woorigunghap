name: Core calculation validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/manse-*.ts"
      - "scripts/compatibility-*.ts"
      - "scripts/day*.ts"
      - "scripts/one-to-one-*.ts"
      - "scripts/pending-*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/manse-validation.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/manse-*.ts"
      - "scripts/compatibility-*.ts"
      - "scripts/day*.ts"
      - "scripts/one-to-one-*.ts"
      - "scripts/pending-*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/manse-validation.yml"

permissions:
  contents: write

jobs:
  apply-report-p1-p2:
    if: github.event_name == 'pull_request' && github.head_ref == 'gpt/report-p1-p2-20260821'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/report-p1-p2-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply and validate P1/P2 once
        run: |
          if [ -f scripts/report-dedup-personalization-test.ts ]; then
            echo "P1/P2 patch already applied; skipping bootstrap."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node .github/scripts/gpt-p1-p2-patch.mjs p1
          npm run test:intro:day-pillar
          npm run lint
          npm run build
          git add src/lib/narrative/report-engine-v6-request.ts src/lib/narrative/report-engine-v7.ts scripts/paid-intro-day-pillar-test.ts package.json .github/workflows/manse-validation.yml
          git commit -m "fix: repair paid intro day pillar contract"

          node .github/scripts/gpt-p1-p2-patch.mjs p2
          npm run test:intro:day-pillar
          npm run test:report:dedup
          npm run test:one-to-one:quality-gate
          npm run lint
          npm run build
          git add src/lib/narrative/report-engine-v6-request.ts src/lib/narrative/name-personalization.ts src/lib/narrative/report-deep-content.ts src/lib/narrative/report-engine-v7.ts src/app/one-to-one/result/result-v2.tsx src/app/one-to-one/result/report-v2-chapters-a.tsx src/app/one-to-one/result/report-v2-chapters-b.tsx scripts/paid-intro-day-pillar-test.ts scripts/report-dedup-personalization-test.ts scripts/one-to-one-quality-gate-test.ts scripts/one-to-one-anthropic-sample-qa.ts package.json .github/workflows/manse-validation.yml
          git commit -m "fix: preserve paid narrative content and remove report duplication"
          git push origin HEAD:gpt/report-p1-p2-20260821

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KASI_SERVICE_KEY: ${{ secrets.KASI_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run 30 golden cases
        run: npm run test:manse
      - name: Run leap-day and month-end invariants
        run: npm run test:manse:boundaries
      - name: Run Day 6 compatibility validation
        run: |
          npm run test:compatibility:day-master
          npm run test:compatibility:day-branch
          npm run test:compatibility:useful-god-prep
          npm run test:compatibility:strength-shadow
          npm run test:compatibility:engine
      - name: Run payment and narrative boundaries
        run: |
          npm run test:day8:payment-gate
          npm run test:day9:narrative-boundary
          npm run test:day9:schema-guard
          npm run test:day10:editorial
          npm run test:day11:server-store
      - name: Run 1:N contracts
        run: |
          npm run test:day13:one-to-many-input
          npm run test:day14:one-to-many-calculation
          npm run test:day15:one-to-many-narrative
          npm run test:day15:one-to-many-result-ui
          npm run test:day16:one-to-many-paid-e2e
      - name: Run account, editorial, policy and system QA contracts
        run: |
          npm run test:day17:kakao-auth
          npm run test:day18:account-report-library
          npm run test:day21:relationship-editorial
          npm run test:day22:operating-policy
          npm run test:day23:system-qa
          npm run test:day24:beta-freeze
          npm run test:pending-library-notify
          npm run test:one-to-one:partner-info
          npm run test:one-to-one:luck-cycle
          npm run test:one-to-one:three-year-timing
          npm run test:one-to-one:quality-gate
      - name: Cross-check KASI when manually requested
        if: ${{ github.event_name == 'workflow_dispatch' && env.KASI_SERVICE_KEY != '' }}
        run: npm run test:manse:kasi
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
