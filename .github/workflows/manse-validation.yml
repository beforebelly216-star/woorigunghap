name: Core calculation validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/manse-*.ts"
      - "scripts/compatibility-*.ts"
      - "scripts/day8-*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/manse-validation.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/manse-*.ts"
      - "scripts/compatibility-*.ts"
      - "scripts/day8-*.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KASI_SERVICE_KEY: ${{ secrets.KASI_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run 30 golden cases
        run: npm run test:manse
      - name: Run leap-day and month-end invariants
        run: npm run test:manse:boundaries
      - name: Run Day 6 day-master compatibility validation
        run: npm run test:compatibility:day-master
      - name: Run Day 6 day-branch compatibility validation
        run: npm run test:compatibility:day-branch
      - name: Run Day 6 useful-god evidence validation
        run: npm run test:compatibility:useful-god-prep
      - name: Run Day 6 strength shadow calibration
        run: npm run test:compatibility:strength-shadow
      - name: Run Day 6 full compatibility engine validation
        run: npm run test:compatibility:engine
      - name: Run Day 8 payment gate regression checks
        run: npm run test:day8:payment-gate
      - name: Cross-check KASI when manually requested
        if: ${{ github.event_name == 'workflow_dispatch' && env.KASI_SERVICE_KEY != '' }}
        run: npm run test:manse:kasi
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
