name: Apply one-to-one quality patch

on:
  push:
    branches:
      - agent/one-to-one-reference-upgrade
    paths:
      - scripts/apply-one-to-one-quality-patch.py
      - .github/workflows/apply-one-to-one-quality-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/one-to-one-reference-upgrade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply targeted patch
        run: python3 scripts/apply-one-to-one-quality-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Verify quality gate regression
        run: |
          npm run test:one-to-one:quality-gate
          npm run test:day10:editorial
          npm run test:day21:relationship-editorial
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-one-to-one-quality-patch.py
          rm .github/workflows/apply-one-to-one-quality-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/narrative/report-engine-v6-request.ts src/lib/narrative/report-engine-v7.ts scripts/one-to-one-quality-gate-test.ts package.json .github/workflows/manse-validation.yml scripts/apply-one-to-one-quality-patch.py .github/workflows/apply-one-to-one-quality-patch.yml
          git commit -m "fix: refine one-to-one narrative quality gate"
          git push origin HEAD:agent/one-to-one-reference-upgrade
