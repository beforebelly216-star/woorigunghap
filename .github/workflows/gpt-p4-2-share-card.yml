name: Temporary P4-2 share card

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'gpt/p4-2-compatibility-share-card-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/p4-2-compatibility-share-card-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply result integration once
        run: |
          node .github/scripts/gpt-p4-2-share-card-patch.mjs
          git add -- src/app/one-to-one/result/result-v2.tsx
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: integrate compatibility share card"
            git push origin HEAD:gpt/p4-2-compatibility-share-card-20260822
          fi
      - name: Validate P4-2 contract
        run: npx tsx scripts/report-share-card-contract-test.ts
      - name: Existing report regression
        run: |
          npm run test:report:persona
          npm run test:report:tone
          npm run test:report:dedup
          npm run test:one-to-one:quality-gate
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
